name: AUR publish

# AUR updates wait for the release to be public: the -bin package's source
# URL is the anonymous GitHub release asset, which 404s while the release is
# still a draft. Running on `release.published` (instead of the tag push that
# builds the draft) guarantees the download works before AUR users see the
# new pkgver. The same run maintains both AUR packages:
#   - pdf-compressor-bin  — installs the release .pkg.tar.zst
#   - pdf-compressor      — builds from the tag tarball (source package)
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Released tag to publish (e.g. v0.7.1)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    name: Push pdf-compressor + pdf-compressor-bin to the AUR
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    env:
      AUR_SSH_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
    steps:
      # actions/checkout runs inside the container and uses the image's git —
      # base-devel ships neither git nor openssh; curl verifies the release
      # assets anonymously before anything is pushed.
      - name: Install container tools
        run: pacman -Syu --noconfirm archlinux-keyring git openssh curl

      # The tag's tree is what the source package builds from — check out the
      # released tag, not the branch head.
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name }}

      - name: Resolve and verify the release assets
        run: |
          set -euo pipefail
          tag="${{ inputs.tag || github.event.release.tag_name }}"
          version="${tag#v}"
          repo="https://github.com/${GITHUB_REPOSITORY}"

          zst_url="${repo}/releases/download/${tag}/pdf-compressor_${version}_amd64.pkg.tar.zst"
          src_url="${repo}/archive/refs/tags/${tag}.tar.gz"

          # Anonymous verification with retries — the whole point of
          # publishing after the release: if either URL is not yet publicly
          # downloadable, fail here instead of breaking AUR installs.
          curl -fsSL --retry 5 --retry-delay 5 -o /tmp/bin.zst "$zst_url"
          curl -fsSL --retry 5 --retry-delay 5 -o /tmp/source.tar.gz "$src_url"

          {
            echo "VERSION=${version}"
            echo "ZST_SHA=$(sha256sum /tmp/bin.zst | cut -d' ' -f1)"
            echo "SRC_SHA=$(sha256sum /tmp/source.tar.gz | cut -d' ' -f1)"
          } >> "$GITHUB_ENV"

      # Renders the PKGBUILD templates with the real pkgver + sha256sums,
      # regenerates .SRCINFO, and pushes both to the AUR. Cloning a
      # not-yet-existing AUR package yields an empty repository — the first
      # push creates the package. Skipped when the secret is not configured,
      # e.g. on forks.
      - name: Push both packages to the AUR
        if: ${{ env.AUR_SSH_KEY != '' }}
        run: |
          set -euo pipefail
          eval "$(ssh-agent -s)"
          printf '%s\n' "${AUR_SSH_KEY}" | ssh-add -
          # Trust-on-first-use for the host key: the container's $HOME
          # (/github/home) made the keyscan-written known_hosts unreliable.
          export GIT_SSH_COMMAND="ssh -o StrictHostKeyChecking=accept-new"
          # makepkg refuses to run as root (the container's default user).
          useradd -m builder

          publish() {
            local aur_name="$1" template="$2" version="$3" sha="$4"
            local work
            work=$(mktemp -d)
            chmod 777 "$work"
            git clone "ssh://aur@aur.archlinux.org/${aur_name}.git" "$work/aur"

            sed -e "s/^pkgver=.*/pkgver=${version}/" \
                -e "s/^sha256sums=.*/sha256sums=('${sha}')/" \
                "$template" > "$work/aur/PKGBUILD"

            # .SRCINFO has to be generated by makepkg, which refuses root and
            # requires a writable startdir. Keep the clone root-owned (the git
            # operations below then don't hit the dubious-ownership refusal)
            # and grant builder write access on the directory itself.
            chmod 777 "$work/aur"
            (cd "$work/aur" && sudo -u builder makepkg --printsrcinfo > .SRCINFO)

            git -C "$work/aur" config user.name "${{ github.actor }}"
            git -C "$work/aur" config user.email "${{ github.actor }}@users.noreply.github.com"
            git -C "$work/aur" add PKGBUILD .SRCINFO
            git -C "$work/aur" commit -m "v${version}" || echo "${aur_name} already up to date"
            git -C "$work/aur" push
            rm -rf "$work"
          }

          publish pdf-compressor-bin packaging/archlinux/PKGBUILD "$VERSION" "$ZST_SHA"
          publish pdf-compressor packaging/archlinux/PKGBUILD.source "$VERSION" "$SRC_SHA"
