name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (tests, type-check & build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint, format & type check (vp check)
        run: pnpm run check

      - name: Unit tests
        run: pnpm test

      - name: Type-check and build
        run: pnpm run build

  rust:
    name: Rust workspace (clippy & tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

      - name: Clippy with the jpx feature
        run: cargo clippy -p pdf-core --all-targets --features jpx -- -D warnings

      - name: Tests with the jpx feature
        run: cargo test -p pdf-core --features jpx

  msrv:
    name: MSRV check (${{ matrix.crate }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # pdf-core's `specta` feature (and the desktop shell) need a newer
          # toolchain than the engine itself, so only src-tauri checks all features.
          - crate: crates/pdf-core
            features: ""
          - crate: src-tauri
            features: "--all-features"
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev librsvg2-dev patchelf

      - name: Read declared rust-version
        id: msrv
        run: |
          msrv=$(sed -n 's/^rust-version *= *"\(.*\)"/\1/p' ${{ matrix.crate }}/Cargo.toml | head -n1)
          if [ -z "$msrv" ]; then
            echo "No rust-version declared in ${{ matrix.crate }}/Cargo.toml" >&2
            exit 1
          fi
          echo "version=$msrv" >> "$GITHUB_OUTPUT"

      # Building with the pinned declared toolchain catches dependencies whose
      # MSRV slipped past Cargo's semver resolution (e.g. jpeg-encoder 0.7).
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: msrv
          workspaces: ${{ matrix.crate }}

      # `tauri::generate_context!` panics when `frontendDist` is absent, and
      # this job compiles without the frontend ever being built.
      - name: Provide a placeholder frontend dist
        if: matrix.crate == 'src-tauri'
        run: mkdir -p frontend/dist

      - name: cargo check --locked at declared MSRV
        working-directory: ${{ matrix.crate }}
        run: cargo check --locked ${{ matrix.features }}

  fuzz:
    name: Fuzz (60s smoke run)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@nightly
      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/pdf-core

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz

      - name: Fuzz the PDF pipeline
        working-directory: crates/pdf-core
        run: cargo +nightly fuzz run pipeline -- -max_total_time=45 -rss_limit_mb=2560 -timeout=10

      - name: Fuzz the JPX decode path
        working-directory: crates/pdf-core
        run: cargo +nightly fuzz run jpx -- -max_total_time=45 -rss_limit_mb=2560 -timeout=10

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: taiki-e/install-action@cargo-audit

      - name: Rust advisory audit
        run: cargo audit --quiet

      - uses: pnpm/action-setup@v4

      - name: pnpm advisory audit (runtime deps)
        run: pnpm audit --prod --audit-level=high
