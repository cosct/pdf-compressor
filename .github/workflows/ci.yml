name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege by default; no job in this workflow needs write access.
# (The audit workflow lives in audit.yml with its own schedule.)
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (tests, type-check & build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint, format & type check (vp check)
        run: pnpm run check

      - name: Unit tests
        run: pnpm test

      - name: Type-check and build
        run: pnpm run build

  rust:
    name: Rust workspace (clippy & tests)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev librsvg2-dev patchelf

      # The engine's fidelity gates rasterize through poppler; the strict
      # renderer gate (testutil::render_poppler_png) only skips when the
      # binary is absent, so CI must guarantee it is present.
      - name: Install poppler for the renderer gates
        run: sudo apt-get install -y poppler-utils

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

        with:
          components: clippy, rustfmt

      # No `workspaces`: `cargo test -p pdf-core` resolves the repo-root
      # workspace, so the cache must target the root target dir (the default).
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace --locked

      # export_bindings (inside the workspace tests above) regenerates the
      # TypeScript bindings; a non-empty diff means the committed file is
      # stale — the frontend/backend contract drifted.
      - name: Bindings freshness
        run: git diff --exit-code frontend/src/lib/bindings.ts

      # `specta` rides along so the standalone feature combination is
      # exercised — inside the workspace it is masked by the app's
      # tauri-specta dependency turning specta's derive feature on.
      - name: Clippy with the optional features
        run: cargo clippy -p pdf-core --all-targets --features jpx,cmyk-cms,specta -- -D warnings

      - name: Tests with the optional features
        run: cargo test -p pdf-core --features jpx,cmyk-cms,specta

      # The desktop shell with the optional features was previously only
      # compiled by the MSRV check — exercise its cfg(feature) surfaces.
      - name: Clippy (desktop shell with the optional features)
        run: cargo clippy -p app --all-targets --features jpx,cmyk-cms -- -D warnings

      - name: Tests (desktop shell with the optional features)
        run: cargo test -p app --features jpx,cmyk-cms

  # The engine is platform-independent Rust (vendored C via cc/cmake), so it
  # can run its full suite on the other two desktop platforms without the
  # webview stack — this is where path-separator and endian drift shows up
  # before a release build does.
  rust-engine-cross:
    name: Engine tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
          - os: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      # No `workspaces`: the tests run from the repo root, so the engine
      # builds into the root workspace's target dir (the cache default).
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Engine tests (default features)
        run: cargo test -p pdf-core --locked

      - name: Engine tests (jpx,cmyk-cms)
        run: cargo test -p pdf-core --features jpx,cmyk-cms

  msrv:
    name: MSRV check (${{ matrix.crate }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # pdf-core's `specta` feature (and the desktop shell) need a newer
          # toolchain than the engine itself, so only src-tauri checks all features.
          - crate: crates/pdf-core
            features: ""
          - crate: src-tauri
            features: "--all-features"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev librsvg2-dev patchelf

      - name: Read declared rust-version
        id: msrv
        run: |
          msrv=$(sed -n 's/^rust-version *= *"\(.*\)"/\1/p' ${{ matrix.crate }}/Cargo.toml | head -n1)
          if [ -z "$msrv" ]; then
            echo "No rust-version declared in ${{ matrix.crate }}/Cargo.toml" >&2
            exit 1
          fi
          echo "version=$msrv" >> "$GITHUB_OUTPUT"

      # Building with the pinned declared toolchain catches dependencies whose
      # MSRV slipped past Cargo's semver resolution (e.g. jpeg-encoder 0.7).
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master (toolchain pinned below)

        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          prefix-key: msrv
          # No `workspaces`: both members resolve the repo-root workspace, so
          # the cache must target the root target dir (the default).

      # `tauri::generate_context!` panics when `frontendDist` is absent, and
      # this job compiles without the frontend ever being built.
      - name: Provide a placeholder frontend dist
        if: matrix.crate == 'src-tauri'
        run: mkdir -p frontend/dist

      - name: cargo check --locked at declared MSRV
        working-directory: ${{ matrix.crate }}
        run: cargo check --locked ${{ matrix.features }}

  fuzz:
    name: Fuzz (60s smoke run)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master (nightly install below)
        with:
          toolchain: nightly

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          # cargo-fuzz builds in the fuzz crate's own workspace (its own
          # target dir), not the repo-root one the engine tests use.
          workspaces: crates/pdf-core/fuzz

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz

      - name: Fuzz the PDF pipeline
        working-directory: crates/pdf-core
        run: cargo +nightly fuzz run pipeline -- -max_total_time=45 -rss_limit_mb=2560 -timeout=10

      - name: Fuzz the JPX decode path
        working-directory: crates/pdf-core
        run: cargo +nightly fuzz run jpx -- -max_total_time=45 -rss_limit_mb=2560 -timeout=10

      - name: Fuzz the bytes pipeline
        working-directory: crates/pdf-core
        run: cargo +nightly fuzz run bytes -- -max_total_time=45 -rss_limit_mb=2560 -timeout=10
