name: Mutation tests

# Mutation testing on the week's changes: run weekly and on demand. The
# full pdf-core suite is infeasible on hosted runners — measured 2026-09-08
# at ~110s per mutant (build-dominated), >5h for the tree, beyond GitHub's
# 6h hard job cap — so the job mutates the diff against the last commit
# before a rolling 7-day window (the same --in-diff discipline used for
# release verification). Results land in mutants.out/ as a build artifact;
# a quiet week yields an empty diff and succeeds trivially.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1" # Mondays 03:00 UTC

jobs:
  mutants:
    name: cargo-mutants (pdf-core)
    runs-on: ubuntu-latest
    # A busy week's diff still fits comfortably; the full-tree figure above
    # is what this ceiling guards against silently regressing into.
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the rolling 7-day base commit needs history

      - uses: dtolnay/rust-toolchain@stable

      # The strict renderer gates (0.7.1+) panic instead of skipping when
      # pdftoppm is missing, and cargo-mutants runs the same test suite as
      # its baseline — without poppler the baseline itself fails and no
      # report is produced.
      - name: Install poppler for the renderer gates
        run: sudo apt-get install -y poppler-utils

      - uses: taiki-e/install-action@cargo-mutants

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      - name: Build the weekly diff (changes since 7 days ago)
        run: |
          BASE=$(git log --format=%H --before="$(date -u -d '7 days ago' +%Y-%m-%dT%H:%M:%SZ)" -1 origin/main)
          if [ -z "$BASE" ]; then
            BASE=$(git rev-list --max-parents=0 HEAD)
          fi
          git diff "$BASE" HEAD > weekly.diff
          echo "Mutating the diff against $BASE:"
          git log --oneline -1 "$BASE"
          wc -l weekly.diff

      # Run from the workspace root so the root .cargo/mutants.toml applies
      # (src/bin exclusion, gitignore-aware tree copy).
      - name: Run cargo-mutants
        run: cargo mutants -p pdf-core --in-diff weekly.diff

      - name: Upload mutants report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutants-out
          path: mutants.out/
          if-no-files-found: warn
