name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  # Single source of truth for the version: the tag must match every
  # manifest before anything builds, so a mistagged push fails in the first
  # minute instead of surfacing as AUR asset 404s at the end of the pipeline.
  verify-version:
    name: Verify tag ↔ manifest version consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Assert the tag matches every version field
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          for file in package.json src-tauri/tauri.conf.json; do
            manifest=$(sed -n 's/.*"version" *: *"\([^"]*\)".*/\1/p' "$file" | head -n1)
            [ "$manifest" = "$tag" ] || { echo "::error::$file has version '$manifest', tag says '$tag'"; exit 1; }
          done
          # NOTE: the root Cargo.toml is a virtual [workspace] manifest with
          # no version field — the crate manifests are crates/pdf-core and
          # src-tauri.
          for file in crates/pdf-core/Cargo.toml src-tauri/Cargo.toml; do
            manifest=$(sed -n 's/^version *= *"\([^"]*\)".*/\1/p' "$file" | head -n1)
            [ "$manifest" = "$tag" ] || { echo "::error::$file has version '$manifest', tag says '$tag'"; exit 1; }
          done
          # -F'\"' puts the bare version in field 2 — a gsub-stripping
          # approach leaves a leading space and never matches.
          for crate in pdf-core app; do
            locked=$(awk -F'\"' -v crate="$crate" '$1 == "name = " && $2 == crate {getline; if ($1 == "version = ") {print $2; exit}}' Cargo.lock)
            [ "$locked" = "$tag" ] || { echo "::error::Cargo.lock pins $crate at '$locked', tag says '$tag' (run pnpm sync-version)"; exit 1; }
          done
          grep -q "^## \[${tag}\]" CHANGELOG.md || { echo "::error::CHANGELOG.md has no section for [$tag]"; exit 1; }
          echo "All manifests agree on ${tag}."

  build-desktop-artifacts:
    needs: verify-version
    permissions:
      contents: write
    timeout-minutes: 60
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The `--config` overlays bundle the headless CLI next to the app
          # (resources) and — on Windows — wire the Explorer context-menu
          # registry entries into the NSIS installer. Local `tauri build` runs
          # stay lean: they do not require the CLI binary to be present.
          - os: windows-latest
            args: '--config src-tauri/tauri.release.windows.conf.json'
          - os: macos-latest
            args: '--target universal-apple-darwin --config src-tauri/tauri.release.conf.json'
          - os: ubuntu-22.04
            args: '--config src-tauri/tauri.release.conf.json'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          # `universal-apple-darwin` is a tauri-action convention, not a rustup
          # target — install the two real slices instead (tauri build lipo's
          # them for `--target universal-apple-darwin`).
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev librsvg2-dev patchelf

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # The headless CLI rides along as a bundle resource — it backs the
      # file-manager context menus (Windows registry entries, macOS Quick
      # Action) and the deb/appimage installs. On macOS both slices of the
      # universal binary are lipo'd together to match the app.
      - name: Build the bundled CLI into src-tauri/binaries
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "macOS" ]; then
            rustup target add aarch64-apple-darwin x86_64-apple-darwin
            cargo build --release --locked -p pdf-core --bin pdf-compressor-cli --features jpx,cmyk-cms --target aarch64-apple-darwin
            cargo build --release --locked -p pdf-core --bin pdf-compressor-cli --features jpx,cmyk-cms --target x86_64-apple-darwin
            mkdir -p src-tauri/binaries
            lipo -create \
              target/aarch64-apple-darwin/release/pdf-compressor-cli \
              target/x86_64-apple-darwin/release/pdf-compressor-cli \
              -output src-tauri/binaries/pdf-compressor-cli
          else
            cargo build --release --locked -p pdf-core --bin pdf-compressor-cli --features jpx,cmyk-cms
            mkdir -p src-tauri/binaries
            # Copy the exact binary, not a glob: a bare `cli*` would sweep
            # any accompanying .pdb into the bundle resources on Windows.
            if [ "${{ runner.os }}" = "Windows" ]; then
              cp target/release/pdf-compressor-cli.exe src-tauri/binaries/
            else
              cp target/release/pdf-compressor-cli src-tauri/binaries/
            fi
          fi
          ls -l src-tauri/binaries/

      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Update signing key — the public half lives in tauri.conf.json;
          # this secret holds the private half (minisign format).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'PDF Compressor ${{ github.ref_name }}'
          releaseDraft: true
          prerelease: false
          # `--features jpx,cmyk-cms` turn on JPEG 2000 decode (vendored
          # OpenJPEG, statically linked) and real CMYK color management
          # (vendored lcms2) in the shipped desktop binaries. `--locked`
          # keeps the release reproducible against Cargo.lock.
          args: ${{ matrix.args }} --locked --features jpx,cmyk-cms

      # Unpack the built NSIS installer and verify its payload layout. The
      # Explorer context-menu entries reference $INSTDIR\app.exe (no
      # mainBinaryName is configured, so the Cargo package name ships as the
      # main binary) and the headless CLI rides in binaries\. Catches path
      # drift between the NSIS hooks and the bundle contents — the 0.10.0
      # installers shipped with a context-menu icon pointing at a file that
      # did not exist.
      - name: Smoke-check the NSIS installer payload
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          set -euo pipefail
          # The workspace builds into the repo-root target dir — src-tauri is
          # a workspace member, not a workspace of its own.
          installer=$(ls target/release/bundle/nsis/*-setup.exe | head -n1)
          echo "installer: $installer"
          rm -rf nsis-payload && mkdir nsis-payload
          7z x -y -onsis-payload "$installer" >/dev/null
          listing=$(find nsis-payload -maxdepth 4 -type f | sort)
          echo "$listing" | sed 's/^/  /' | head -40
          # 7-Zip prefixes NSIS payload entries with the installer's
          # install-dir macro (e.g. `$INSTDIR\`), so assert on names relative
          # to the main binary instead of a hard-coded flat layout.
          main=$(find nsis-payload -type f -name 'app.exe' -print -quit)
          [ -n "$main" ] || { echo "::error::expected the main binary as app.exe (the context-menu Icon targets it)"; exit 1; }
          main_dir=$(dirname "$main")
          [ -f "$main_dir/binaries/pdf-compressor-cli.exe" ] \
            || { echo "::error::expected the headless CLI at binaries\\pdf-compressor-cli.exe next to the main binary (the context-menu commands target it)"; exit 1; }
          [ -z "$(find nsis-payload -type f -name 'pdf-compressor.exe' -print -quit)" ] \
            || echo "::warning::pdf-compressor.exe also exists in the payload — the context-menu Icon should point at it instead"

      # The Arch package job rebuilds the .pkg.tar.zst from these raw release
      # binaries via the same makepkg pipeline as a local `pnpm run tauri:arch`
      # (scripts/build-arch-bundle.sh) — no recompilation, no drift.
      - name: Export the release binaries for the Arch package job
        if: matrix.os == 'ubuntu-22.04'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: linux-release-binaries
          path: |
            target/release/app
            target/release/pdf-compressor-cli
          if-no-files-found: error
          retention-days: 5

  # tauri-action creates the draft release with an empty body. The notes are
  # generated from the tag's CHANGELOG.md section (the canonical document)
  # by scripts/release-notes.sh — a release can no longer ship with an empty
  # body, and the notes never drift from the changelog.
  release-notes:
    name: Release notes from CHANGELOG
    needs: build-desktop-artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Fill the draft release body
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./scripts/release-notes.sh "${GITHUB_REF_NAME}" > notes.md
          gh release edit "${GITHUB_REF_NAME}" --notes-file notes.md

  # The artifacts are unsigned at the OS level (updater signatures only);
  # a published checksum file is the integrity story users can verify.
  # Own job (not a step of release-notes): it must wait for the zst to land,
  # or the sums nondeterministically omit the Arch package when the
  # arch-package upload wins the race.
  release-checksums:
    name: SHA256SUMS for the release assets
    needs: [build-desktop-artifacts, arch-package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 10
    steps:
      - name: Attach SHA256SUMS for the release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          gh release download "${GITHUB_REF_NAME}" --dir release-assets --clobber
          rm -f release-assets/SHA256SUMS
          (
            cd release-assets
            : > ../SHA256SUMS
            for asset in *; do
              [ -f "$asset" ] || continue
              sha256sum "$asset" >> ../SHA256SUMS
            done
          )
          gh release upload "${GITHUB_REF_NAME}" SHA256SUMS --clobber

  arch-package:
    name: Arch package (zst)
    needs: build-desktop-artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: write
    container:
      image: archlinux:base-devel
    steps:
      # actions/checkout runs inside the container and uses the image's git —
      # base-devel ships neither git nor openssh, and gh is needed below for
      # the release upload.
      - name: Install container tools
        run: pacman -Syu --noconfirm archlinux-keyring git github-cli openssh

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Restore the release binaries into target/release
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: linux-release-binaries
          path: target/release

      # makepkg refuses to run as root (the container's default user).
      - name: Build the .pkg.tar.zst (same pipeline as pnpm run tauri:arch)
        run: |
          chmod +x target/release/app target/release/pdf-compressor-cli
          useradd -m builder
          chown -R builder: .
          sudo -u builder bash scripts/build-arch-bundle.sh

      - name: Attach the zst to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # `gh` resolves the repo via git, and the workspace is owned by
          # `builder` after the packaging step while this step runs as root.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          version="${GITHUB_REF_NAME#v}"
          zst="target/release/bundle/archlinux/pdf-compressor_${version}_amd64.pkg.tar.zst"
          gh release upload "${GITHUB_REF_NAME}" "$zst" --clobber

      # AUR updates happen in .github/workflows/aur-publish.yml once this
      # draft release is actually published: the -bin package's source URL
      # is the anonymous release asset, which 404s while the release is
      # still a draft. Pushing from the tag workflow would expose the new
      # AUR version before its download works.
