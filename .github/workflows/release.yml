name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-desktop-artifacts:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The `--config` overlays bundle the headless CLI next to the app
          # (resources) and — on Windows — wire the Explorer context-menu
          # registry entries into the NSIS installer. Local `tauri build` runs
          # stay lean: they do not require the CLI binary to be present.
          - os: windows-latest
            args: '--config src-tauri/tauri.release.windows.conf.json'
          - os: macos-latest
            args: '--target universal-apple-darwin --config src-tauri/tauri.release.conf.json'
          - os: ubuntu-22.04
            args: '--config src-tauri/tauri.release.conf.json'

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          # `universal-apple-darwin` is a tauri-action convention, not a rustup
          # target — install the two real slices instead (tauri build lipo's
          # them for `--target universal-apple-darwin`).
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev librsvg2-dev patchelf

      - uses: Swatinem/rust-cache@v2

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # The headless CLI rides along as a bundle resource — it backs the
      # file-manager context menus (Windows registry entries, macOS Quick
      # Action) and the deb/appimage installs. On macOS both slices of the
      # universal binary are lipo'd together to match the app.
      - name: Build the bundled CLI into src-tauri/binaries
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "macOS" ]; then
            rustup target add aarch64-apple-darwin x86_64-apple-darwin
            cargo build --release --locked -p pdf-core --bin pdf-compressor-cli --features jpx --target aarch64-apple-darwin
            cargo build --release --locked -p pdf-core --bin pdf-compressor-cli --features jpx --target x86_64-apple-darwin
            mkdir -p src-tauri/binaries
            lipo -create \
              target/aarch64-apple-darwin/release/pdf-compressor-cli \
              target/x86_64-apple-darwin/release/pdf-compressor-cli \
              -output src-tauri/binaries/pdf-compressor-cli
          else
            cargo build --release --locked -p pdf-core --bin pdf-compressor-cli --features jpx
            mkdir -p src-tauri/binaries
            cp target/release/pdf-compressor-cli* src-tauri/binaries/
          fi
          ls -l src-tauri/binaries/

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Update signing key — the public half lives in tauri.conf.json;
          # this secret holds the private half (minisign format).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'PDF Compressor ${{ github.ref_name }}'
          releaseDraft: true
          prerelease: false
          # `--features jpx` turns on JPEG 2000 decode (vendored OpenJPEG,
          # statically linked) in the shipped desktop binaries.
          args: ${{ matrix.args }} --features jpx

  aur-checksum:
    name: AUR source checksum
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compute source tarball sha256
        run: |
          curl -fsSL -o source.tar.gz \
            "https://github.com/${{ github.repository }}/archive/refs/tags/${{ github.ref_name }}.tar.gz"
          echo "## AUR sha256 for ${{ github.ref_name }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "sha256sums=('$(sha256sum source.tar.gz | cut -d" " -f1)')" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "Paste the line above into packaging/archlinux/PKGBUILD before publishing."
          cat "$GITHUB_STEP_SUMMARY"
