[package]
name = "pdf-core"
version = "0.2.0"
description = "Pure-Rust PDF analysis and selective compression engine"
authors = ["cosct"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "pdf_core"

[features]
# Derives `specta::Type` on the wire models for TypeScript binding generation
# in the Tauri app. Off by default to keep the engine dependency-light.
specta = ["dep:specta"]

[dependencies]
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
lopdf = "0.38"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3"
thiserror = "2"
specta = { version = "=2.0.0-rc.25", optional = true }
jpeg-encoder = { version = "0.6.1", features = ["simd"] }

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "compression"
harness = false

[[bench]]
name = "encoder"
harness = false

[lints]
workspace = true
