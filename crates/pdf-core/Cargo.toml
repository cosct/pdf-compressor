[package]
name = "pdf-core"
version = "0.7.1"
description = "Pure-Rust PDF analysis and selective compression engine"
authors = ["cosct"]
license = "MIT"
edition = "2021"
# Engine-only MSRV (default features). The optional `specta` feature and the
# desktop shell in src-tauri require a newer toolchain (see src-tauri/Cargo.toml).
rust-version = "1.88"

[lib]
name = "pdf_core"

[[bin]]
name = "pdf-compressor-cli"
path = "src/bin/pdf-compressor-cli.rs"

[features]
default = ["ccitt", "subset-fonts"]
# Derives `specta::Type` on the wire models for TypeScript binding generation
# in the Tauri app. Off by default to keep the engine dependency-light.
specta = ["dep:specta"]
# Fixture builders for tests/benches/examples (`src/testutil.rs`). Enabled by
# the dev-dependency on itself below, so normal builds never compile it.
testutil = []
# CCITT Group 4 (ITU T.6) encode/decode for bi-level scanned images via the
# pure-Rust `fax` crate (MSRV 1.71, no_std-friendly). Default-on: scanned
# documents are a core use case; disable to shed the dependency.
ccitt = ["dep:fax"]
# Font subsetting for Type0/CIDFontType2 embedded fonts via typst's pure-Rust
# `subsetter` (MSRV 1.85, default features depend only on rustc-hash).
# Default-on; the code path only runs when the `subset_fonts` setting is on.
subset-fonts = ["dep:subsetter"]
# JPX (JPEG 2000) decoding via the `jpeg2k` safe wrapper over `openjpeg-sys`,
# which compiles vendored OpenJPEG with the plain `cc` crate and links it
# statically — no cmake, no runtime libopenjp2 to ship. Default OFF: the C
# decode path takes this build out of pure-Rust territory (see
# docs/DEVELOPMENT.md "JPX 接入"). The unsafe surface is confined to the
# vendored FFI; the fuzz target builds with this feature enabled.
jpx = ["dep:jpeg2k"]
# Real CMYK→sRGB color management (P0 of the 0.7.0 roadmap): ICC N=4 images
# convert through the embedded profile with Little CMS (`lcms2` safe wrapper,
# Apache-2.0/MIT; `lcms2-sys` vendored C built by the plain `cc` crate and
# linked statically, mirroring jpx's OpenJPEG setup — no pkg-config, no
# runtime liblcms2 to ship). Profile-less CMYK (DeviceCMYK, JPX, CMYK-based
# Indexed) converts through the calibrated SWOP matrix poppler/PDFium use.
# Default OFF keeps default builds free of the C dependency and the lcms2
# crate's newer MSRV; with the feature off, the opt-in `cmyk_conversion`
# setting keeps the 0.6.0 naive ink-subtraction behavior. The direct
# `zune-jpeg` dependency (already in the tree via `image`) fetches raw CMYK
# planes out of DCT streams instead of the decoder's own RGB conversion.
cmyk-cms = ["dep:lcms2", "dep:zune-jpeg"]

[dependencies]
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
lopdf = "0.44"
# Pure-Rust JBIG2 (ITU T.88) decode for scanned text pages — no feature
# gate needed (no C toolchain). `std` only: the decode sink is local, so
# neither the `image` integration nor `simd` features are required.
hayro-jbig2 = { version = "0.3", default-features = false, features = ["std"] }
fax = { version = "0.3", optional = true }
subsetter = { version = "0.2", optional = true }
# No-default-features: we assemble planes from `components()` ourselves
# (the crate's `get_pixels` rejects CMYK and hides subsampling) and never
# touch its file I/O.
jpeg2k = { version = "0.10", default-features = false, features = ["openjpeg-sys"], optional = true }
# CMYK color management (`cmyk-cms` feature). "static" forces the vendored
# lcms2 C build (cc + static link); versions 6.2+ require Rust 1.89+, which
# only applies to builds that enable the feature — the engine MSRV (1.88)
# covers default features.
lcms2 = { version = "6.2", optional = true, features = ["static"] }
# Raw CMYK/YCCK plane access for DCT streams (`cmyk-cms` only); the same
# version `image` already pulls in, so nothing extra lands in the tree.
zune-jpeg = { version = "0.5", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3"
thiserror = "2"
# Quick-profile path resolution (`quick-profile.json` under the OS config
# dir), shared by the CLI reader and the desktop settings writer.
dirs-next = "2.0"
specta = { version = "=2.0.0-rc.25", optional = true }
jpeg-encoder = { version = "0.7", features = ["simd"] }
# Not referenced in code: declared so feature unification switches lopdf's
# flate2 (stream compression, object streams) to the zlib-ng C backend.
flate2 = { version = "1", default-features = false, features = ["zlib-ng"] }
rustc-hash = "2"
fast_image_resize = { version = "6", features = ["image"] }

[dev-dependencies]
criterion = "0.5"
# Self dev-dependency: turns on the `testutil` feature for tests, benches,
# and examples only (resolver = "2" keeps it out of normal builds).
pdf-core = { path = ".", features = ["testutil"] }

[[bench]]
name = "compression"
harness = false

[[bench]]
name = "encoder"
harness = false

[lints]
workspace = true
