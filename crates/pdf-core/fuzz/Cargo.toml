[package]
name = "pdf-core-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

# Standalone crate outside the main workspace — cargo-fuzz builds it with its
# own sanitizer flags and lockfile.
[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
lopdf = "0.44"

# The `jpx` feature pulls in the vendored OpenJPEG C code — exactly the
# unsafe surface the fuzz targets must hammer. cargo-fuzz propagates the
# sanitizer flags to `cc` builds via CFLAGS, so the C decode path is
# instrumented and leak/overflow-checked like the Rust code. JBIG2 decoding
# is pure Rust (hayro-jbig2) and exercises the pipeline target by default.
[dependencies.pdf-core]
path = ".."
features = ["jpx"]

[[bin]]
name = "pipeline"
path = "fuzz_targets/pipeline.rs"
test = false
doc = false
bench = false

[[bin]]
name = "jpx"
path = "fuzz_targets/jpx.rs"
test = false
doc = false
bench = false
