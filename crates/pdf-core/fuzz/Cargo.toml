[package]
name = "pdf-core-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

# Standalone crate outside the main workspace — cargo-fuzz builds it with its
# own sanitizer flags and lockfile.
[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
lopdf = "0.45"

# The `jpx` and `cmyk-cms` features pull in the vendored OpenJPEG and
# lcms2 C code — exactly the unsafe surfaces the fuzz targets must hammer.
# cargo-fuzz propagates the sanitizer flags to `cc` builds via CFLAGS, so
# the C decode paths are instrumented and leak/overflow-checked like the
# Rust code. JBIG2 decoding is pure Rust (hayro-jbig2) and exercises the
# pipeline target by default; `cmyk-cms` additionally routes arbitrary
# ICC-profile bytes into the lcms2 parser via the enabled conversion.
[dependencies.pdf-core]
path = ".."
features = ["jpx", "cmyk-cms"]

[[bin]]
name = "pipeline"
path = "fuzz_targets/pipeline.rs"
test = false
doc = false
bench = false

[[bin]]
name = "jpx"
path = "fuzz_targets/jpx.rs"
test = false
doc = false
bench = false
