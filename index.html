<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Desktop-first PDF compression with guided analysis, selective optimization, and local file handling."
    />
    <meta name="author" content="cosct" />
    <title>PDF Compressor</title>
    <style>
      /* Fallback theme based on OS preference (before inline script sets data-theme) */
      :root { color-scheme: light dark; }
      @media (prefers-color-scheme: dark) { :root:not([data-theme]) { background: #0f1319; color-scheme: dark; } }
      @media (prefers-color-scheme: light) { :root:not([data-theme]) { background: #eef1f6; color-scheme: light; } }
      [data-theme='dark'] { color-scheme: dark; background: #0f1319; }
      [data-theme='light'] { color-scheme: light; background: #eef1f6; }

      html, body, #app {
        min-height: 100%;
        margin: 0;
      }

      body {
        min-height: 100vh;
      }

      [data-theme='dark'] body,
      [data-theme='dark'] #app {
        background: #0f1319;
        color: #eef1f8;
      }

      [data-theme='light'] body,
      [data-theme='light'] #app {
        background: #eef1f6;
        color: #0f1720;
      }

      #app:empty::before {
        content: var(--app-loading-text, 'Loading PDF Compressor\2026');
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        font: 500 14px/1.4 'Segoe UI Variable', 'Segoe UI', -apple-system, sans-serif;
        letter-spacing: 0.04em;
        opacity: 0.6;
      }
    </style>
    <script>
      // Apply theme before first paint to avoid flash
      (function() {
        var stored = null;
        try { stored = localStorage.getItem('pdf-compressor-theme'); } catch(e) {}
        var theme = stored || 'system';
        if (theme === 'system') {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', theme);
        document.documentElement.style.colorScheme = theme;
      })();
      // Localize document chrome (lang, title, loading text) before first paint,
      // mirroring detectInitialLocale() in src/i18n/index.ts
      (function() {
        var stored = null;
        try { stored = localStorage.getItem('pdf-compressor-locale'); } catch(e) {}
        var browserLocale = '';
        try {
          browserLocale = (navigator.languages && navigator.languages[0]) || navigator.language || '';
        } catch(e) {}
        var isZh = (stored || browserLocale).toLowerCase().indexOf('zh') === 0;
        if (isZh) {
          document.documentElement.lang = 'zh-CN';
          document.title = 'PDF 压缩器';
          document.documentElement.style.setProperty('--app-loading-text', '正在加载 PDF 压缩器\2026');
        }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
