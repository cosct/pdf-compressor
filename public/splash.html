<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Loading PDF Compressor</title>
    <style>
      :root {
        color-scheme: dark;
        background: #0f1319;
        font-family: "Segoe UI Variable", "Segoe UI", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background:
          radial-gradient(circle at 20% 0%, rgba(76, 194, 255, 0.18), transparent 24%),
          linear-gradient(180deg, #171b21, #0f1319);
        color: #f3f7fb;
      }

      body {
        display: grid;
        place-items: center;
      }

      .splash {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 18px;
        padding: 28px 32px;
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 24px;
        background: rgba(26, 31, 39, 0.82);
        backdrop-filter: blur(24px);
        box-shadow: 0 16px 48px rgba(0, 0, 0, 0.28);
      }

      .mark {
        display: grid;
        place-items: center;
        width: 54px;
        height: 54px;
        border-radius: 16px;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.08);
      }

      .copy {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        text-align: center;
      }

      .copy strong {
        font-size: 15px;
        font-weight: 600;
        letter-spacing: 0.02em;
      }

      .copy span {
        font-size: 12px;
        color: rgba(243, 247, 251, 0.68);
      }

      .bar {
        position: relative;
        width: 180px;
        height: 4px;
        overflow: hidden;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.08);
      }

      .bar::after {
        content: "";
        position: absolute;
        inset: 0;
        width: 42%;
        border-radius: inherit;
        background: linear-gradient(90deg, #4cc2ff, #7bd8ff);
        animation: loading 1.15s ease-in-out infinite;
      }

      @keyframes loading {
        0% { transform: translateX(-110%); }
        100% { transform: translateX(250%); }
      }
    </style>
  </head>
  <body>
    <div class="splash">
      <div class="mark" aria-hidden="true">
        <svg width="28" height="28" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="5" y="4" width="22" height="24" rx="6" stroke="rgba(243,247,251,0.92)" stroke-width="1.6"/>
          <path d="M10 11.5h12M10 16h12M10 20.5h7" stroke="rgba(243,247,251,0.92)" stroke-width="1.6" stroke-linecap="round"/>
          <path d="M21 18.5l3 3-3 3" stroke="#4cc2ff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M24 21.5h-8" stroke="#4cc2ff" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="copy">
        <strong>PDF Compressor</strong>
        <span>Loading workspace...</span>
      </div>
      <div class="bar" aria-hidden="true"></div>
    </div>
  </body>
</html>
