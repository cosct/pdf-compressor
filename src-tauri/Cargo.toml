[package]
name = "app"
version = "0.3.0"
description = "A selective PDF compression desktop app built with Tauri and Rust"
authors = ["cosct"]
license = "MIT"
repository = ""
edition = "2021"
# Driven by specta 2.0.0-rc.25 (needs Rust 1.93 for `debug_closure_helpers`);
# pdf-core without the `specta` feature builds on 1.88.
rust-version = "1.93"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
pdf-core = { path = "../crates/pdf-core", features = ["specta"] }
dirs-next = "2.0"
opener = { version = "0.7", features = ["reveal"] }
log = "0.4"
serde_json = "1.0"
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
tauri = { version = "2.10.3", features = [] }
tauri-specta = { version = "2.0.0-rc.25", features = ["derive", "typescript"] }
specta = "=2.0.0-rc.25"
specta-typescript = "=0.0.12"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
