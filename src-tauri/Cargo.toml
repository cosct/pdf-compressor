[package]
name = "app"
version = "0.1.0"
description = "A selective PDF compression desktop app built with Tauri and Rust"
authors = ["cosct"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
lopdf = "0.38"
log = "0.4"
printpdf = { version = "0.8", default-features = false, features = ["jpeg", "png"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri = { version = "2.10.3", features = [] }
thiserror = "2"
